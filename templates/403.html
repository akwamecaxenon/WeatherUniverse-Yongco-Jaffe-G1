{% extends 'base.html' %}
{% block title %}Access denied &middot; Weather Universe{% endblock %}
{% block content %}
<section class="card narrow center">
  <h1>Access denied</h1>
  <p class="muted">Your account does not have permission to open this page.</p>
  {% if user.is_authenticated %}
    <a class="btn" href="{% url 'accounts:redirect' %}">Go to my dashboard</a>
  {% else %}
    <a class="btn" href="{% url 'accounts:login' %}">Log in</a>
  {% endif %}
</section>
{% endblock %}
